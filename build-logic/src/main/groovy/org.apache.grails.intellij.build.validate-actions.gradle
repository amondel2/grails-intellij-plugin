import org.apache.grails.intellij.build.ValidateActionsTask

// Checks every `uses:` entry in the GitHub workflow files against the ASF approved-actions policy
// (https://github.com/apache/infrastructure-actions). Applied to the root project only: the
// .github/workflows directory it scans is the repository's.
//
// Deliberately not hooked into `check`: the approved list is fetched from ASF infrastructure on
// every run, so the task needs the network and has no place in a local build. CI invokes it
// explicitly from .github/workflows/validate-actions.yml.

def workflows = fileTree(layout.projectDirectory.dir('.github/workflows'))
workflows.include('*.yml', '*.yaml')

tasks.register('validateActions', ValidateActionsTask) { ValidateActionsTask task ->
    task.group = 'verification'
    task.description = 'Validates that every uses: entry in the GitHub workflow files is on the ASF approved list.'
    task.rootDirectory.set(layout.projectDirectory)
    task.workflowFiles.from(workflows)
    // The approved list is fetched from ASF infrastructure on every run, so unchanged workflow
    // files do not imply an unchanged verdict. The scheduled run exists precisely to catch a
    // pinned SHA being delisted upstream, which an up-to-date check would hide.
    task.outputs.upToDateWhen { false }
}
