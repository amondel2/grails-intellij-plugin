// Per-project JaCoCo conventions. The cross-project aggregate is produced by the root build
// via org.apache.grails.intellij.build.coverage-aggregation, which wraps Gradle's built-in
// jacoco-report-aggregation plugin (configuration-cache safe, unlike a hand-rolled aggregate).

plugins {
    id 'jacoco'
}

jacoco {
    // keep in sync with `jacocoVersion` in gradle.properties
    toolVersion = providers.gradleProperty('jacocoVersion').getOrElse('0.8.15')
}

tasks.withType(Test).configureEach { task ->
    // IntelliJ's plugin class loaders define classes without a code-source location, and the
    // JaCoCo agent skips such classes unless told otherwise. Without this the execution data
    // holds only the Gradle test-worker classes and every plugin class reports 0%. The JDK's
    // internal classes have no location either and are excluded as JaCoCo recommends.
    task.jacoco.includeNoLocationClasses = true
    task.jacoco.excludes = ['jdk.internal.*']

    // The Community Edition test task is registered behind -PplatformEdition=IC and lives on its
    // own IdeaIC sandbox; it must not finalize the Ultimate coverage reports, which would drag the
    // IdeaIC download into a routine `./gradlew test`.
    if (task.name == 'testIdeCe') return
    task.finalizedBy tasks.withType(JacocoReport)
}

tasks.withType(JacocoReport).configureEach {
    dependsOn tasks.withType(Test).matching { it.name != 'testIdeCe' }
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

// IntelliJ Platform projects do not run their tests against build/classes: IPGP installs the
// plugin into the test sandbox and the IDE loads it from those jars, which are built from the
// *instrumented* classes (instrumentCode adds the @NotNull assertions). JaCoCo keys execution
// data by class identity, so a report that analyses build/classes (the jacoco plugin's default)
// matches nothing and shows 0% for every class. Point the report at the instrumented output
// instead, where the task exists; plain libraries keep the default.
tasks.withType(JacocoReport).configureEach { report ->
    def instrumentCode = tasks.matching { it.name == 'instrumentCode' }
    report.classDirectories.setFrom(project.provider {
        instrumentCode.isEmpty() ? sourceSets.main.output.classesDirs : instrumentCode.collect { it.outputs.files }
    })
    report.dependsOn(instrumentCode)
}
