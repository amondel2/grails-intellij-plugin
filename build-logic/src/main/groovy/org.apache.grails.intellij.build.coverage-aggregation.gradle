import org.gradle.api.attributes.LibraryElements
import org.gradle.testing.jacoco.plugins.JacocoCoverageReport
import org.jetbrains.intellij.platform.gradle.attributes.ComposedJarRule

// Cross-project JaCoCo aggregation, applied to the root project so the report path that CI
// uploads (build/reports/jacoco/testCodeCoverageReport/testCodeCoverageReport.xml) is unchanged
// by the restructure.
//
// jacoco-report-aggregation only auto-registers <suite>CodeCoverageReport for projects that
// apply jvm-test-suite, and the root project compiles nothing. The report is therefore
// registered explicitly here; without this the task simply would not exist and the coverage
// workflow would fail with "task not found".
//
// Report formats are configured by org.apache.grails.intellij.build.jacoco where it is applied;
// this project has no test suite of its own, so the formats are set on the aggregate directly.

plugins {
    id 'jacoco-report-aggregation'
}

// Since IPGP 2.19 the module plugin tags every project dependency of an IntelliJ Platform project
// with libraryelements=composed-jar (instead of forcing it on the whole classpath), and makes that
// request compatible with a plain jar through its ComposedJarRule -- but only in the attribute
// schema of the projects it is applied to. This root project applies no IPGP plugin, yet its
// aggregation resolves straight through :plugin to the plain library projects it depends on.
// Without the rule here, composed-jar matches none of their variants and Gradle reports a capability
// conflict ("Cannot select module because of conflict with project ... Both provide capability")
// for every one of them. Registering the same rule on the root schema restores the compatibility.
dependencies.attributesSchema.attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE) {
    compatibilityRules.add(ComposedJarRule)
}

// Registered only when it does not already exist. jacoco-report-aggregation auto-registers
// <suite>CodeCoverageReport for projects that apply jvm-test-suite, which the root does today
// because it still owns the plugin source. Once the plugin moves to its own project the root
// compiles nothing, the auto-registration stops happening, and this branch takes over -- keeping
// the report at the path the coverage workflow uploads either way.
if (!reporting.reports.names.contains('testCodeCoverageReport')) {
    reporting.reports.register('testCodeCoverageReport', JacocoCoverageReport) { report ->
        report.testSuiteName = 'test'
    }
}

// The aggregate has the same class-identity problem as the per-project reports (see
// org.apache.grails.intellij.build.jacoco): IntelliJ Platform projects run their tests from the
// sandbox jars built from the instrumented classes, so their coverage only matches when the
// report analyses build/instrumented/instrumentCode rather than build/classes. Each aggregated
// project contributes its instrumented output when it has one, its plain classes otherwise.
def aggregatedClassDirectories = objects.fileCollection()
configurations.jacocoAggregation.dependencies.withType(ProjectDependency).all { dependency ->
    def aggregated = project(dependency.path)
    aggregated.afterEvaluate {
        def instrumentCode = aggregated.tasks.matching { it.name == 'instrumentCode' }
        aggregatedClassDirectories.from(aggregated.provider {
            instrumentCode.isEmpty() ? aggregated.sourceSets.main.output.classesDirs : instrumentCode.collect { it.outputs.files }
        })
        aggregatedClassDirectories.builtBy(instrumentCode)
    }
}

tasks.named('testCodeCoverageReport') { task ->
    task.classDirectories.setFrom(aggregatedClassDirectories)
    task.reports.xml.required = true
    task.reports.html.required = true
    task.reports.csv.required = false
}
